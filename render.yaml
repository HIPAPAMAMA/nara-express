# Render Blueprint — 이 저장소를 Render에 처음 연결할 때 이 파일을 인식해서
# 아래 2개 서비스를 자동으로 만들어준다. (Cloud Run/HWP 변환 서비스는 제외 — 보류 결정)
# 배포 전 실제 검증은 못 했음 — Render 대시보드에서 처음 연결할 때 오류 나면 그 화면 문구 그대로 알려줄 것.

services:
  # 백엔드: functions/ 의 Express 서버 (검색 API 프록시, 청크 엔진 등)
  - type: web
    name: nara-express-api
    runtime: node
    rootDir: functions
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NARA_SERVICE_KEY
        sync: false # 공공데이터포털 인증키 — Render 대시보드에서 직접 입력 (레포에 안 올림)
      - key: FRONTEND_ORIGIN
        value: https://nara-express-web.onrender.com # CORS 허용 출처. 아래 정적사이트 이름과 맞출 것

  # 프론트엔드: web/ 의 Vite 빌드 결과물 (정적 사이트)
  - type: web
    name: nara-express-web
    runtime: static
    rootDir: web
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nara-express-api.onrender.com/api # 위 백엔드 서비스 이름과 맞출 것
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # React SPA 라우팅 — 새로고침해도 404 안 나게
